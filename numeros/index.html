<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Inserção de dados no Select e cálculos</h1>
    <div id="container-corpo">
        <div class="divisao">
            <label for="">Número (entre 1 e 100):</label>
            <input type="number" id="numero" min="1" max="100">
            <input type="submit" id="botao" value="Adicionar" onclick="adicionar()">
        </div>
        <div class="divisao">
            <select value="numerosAdicionados" id="numLista">
            </select>
            <input type="submit" id="botao" value="Finalizar" onclick="finalizar()">
        </div>
    </div>
    <div id="resultados">
    </div>
    <script src="script.js"></script>
</body>
</html>
